<html>
    <head>
        <title>Login Page</title>
        <link rel="stylesheet" href="../CSS/practical15c.css">
    </head>
    <body>

        <!-- Header Section -->
        <div id="header">
            <h3>Bhumika</h3>
            <h2>This is the practical solution for Practical 12</h2>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="loginform">
                <form action="practical11.html">
                    <fieldset>
                        <legend>Login Form</legend>
                        <p>
                            <label for="email">Email ID</label>
                            <input type="email" name="email" placeholder="Enter your email here...">
                        </p>

                        <p>
                            <strong>OR</strong>
                        </p>

                        <p>
                            <label for="phone">Phone Number</label>
                            <input type="text" name="phone" placeholder="Enter your phone number here...">
                        </p>

                        <p>
                            <label for="password">Password</label>
                            <input type="password" name="password" placeholder="Enter your password..." required>
                        </p>

                        <p>
                            <input type="submit" value="Login">
                            <input type="reset" value="Reset">
                        </p>

                        <p>
                            <h4>Don't have an account?
                                <a href="practical11.html">Register</a>
                            </h4>
                        </p>
                    </fieldset>
                </form>
            </div>
        </div>

        <!-- Footer Section -->
        <div class="footer">
            <p>&copy;Bhumika</p>
        </div>
    </body>
</html>
